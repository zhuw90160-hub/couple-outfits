</style><main><header><div><div class="eyebrow">TWO PEOPLE, ONE LITTLE EVERYDAY</div><h1>今天穿一对</h1><p>不用一模一样，也能刚好相配。</p></div><span class="tag">♡ 双人日常 / 02 · 穿搭小实验</span></header><div class="layout"><section class="stage"><div class="scene-head"><div>OUR LITTLE LOOKBOOK<strong id="sceneTitle">一起，把今天穿成喜欢的样子。</strong></div><span id="sceneLabel">街角 · 午后</span></div><svg id="art" viewBox="0 0 800 540" role="img" aria-label="小A与小B的实时穿搭画面"></svg><div class="looklist"><div id="lookA"></div><div id="lookB"></div></div><div class="caption" id="caption" aria-live="polite">同色的细节，是两个人的小小默契。</div></section><aside class="panel"><h2>把日常穿成你的样子</h2><div class="recommend"><b id="recName">奶油抹茶 · 校园散步</b><div class="small" id="recDesc">低饱和绿与米白呼应，轻松又干净。</div><button class="primary" id="recommend">✧ 推荐搭配 · 换一换</button></div><div class="tabs" role="group" aria-label="选择人物"><button id="tabA" class="active" aria-pressed="true">● 小 A</button><button id="tabB" aria-pressed="false">● 小 B</button></div><div id="controls"></div><hr><div class="fields"><select id="background" aria-label="背景"><option>街角</option><option>公园</option><option>校园</option></select><select id="time" aria-label="时间"><option>午后</option><option>清晨</option><option>傍晚</option><option>夜晚</option></select></div><div class="actions"><button id="swap">⇄ 交换穿搭</button><button id="save">↓ 保存合照</button></div><button id="reset" style="width:100%;margin-top:8px">恢复初始搭配</button><p class="small" style="line-height:1.8;margin-bottom:0">两个衣橱一样自由。点击色块或颜色框，可以给每件单品换色。搭配会自动保存在这台设备。</p></aside></div><footer><span>双人日常系列 · <a href="https://zhuw90160-hub.github.io/umbrella-simulator/" target="_blank" rel="noopener">01 同一把伞下 ↗</a> / 02 今天穿一对</span><span>小 A + 小 B，和无数种一起出门的可能。</span></footer></main><script>
const $=id=>document.getElementById(id), options={top:['卫衣','羽绒服','短袖','衬衫'],bottom:['长裤','短裤','长裙','短裙'],belt:['无腰带','细腰带','宽腰带'],shoe:['运动鞋','休闲鞋','高跟鞋','靴子']},labels={top:'上装',bottom:'下装',belt:'腰带',shoe:'鞋子'},colors=['#eee7d7','#a1b3a0','#344c48','#c47756','#7f9aaf','#d9afb0','#5b4e46','#f8f6ef','#33343b'];
const outfit=(top,tc,bottom,bc,shoe,sc,belt='无腰带',beltColor='#5b4e46')=>({top,topColor:tc,bottom,bottomColor:bc,shoe,shoeColor:sc,belt,beltColor});
const presets=[['奶油抹茶 · 校园散步','低饱和绿与米白呼应，轻松又干净。',outfit('卫衣','#a1b3a0','长裤','#eee7d7','运动鞋','#f8f6ef'),outfit('卫衣','#eee7d7','短裙','#a1b3a0','运动鞋','#f8f6ef')],['蓝白来信 · 夏日出游','蓝白交错，鞋子用相同的白色收尾。',outfit('短袖','#f8f6ef','短裤','#7f9aaf','运动鞋','#f8f6ef'),outfit('衬衫','#7f9aaf','长裙','#f8f6ef','休闲鞋','#eee7d7')],['热可可 · 冬日约会','同一季节的羽绒服，搭上可可与燕麦色。',outfit('羽绒服','#5b4e46','长裤','#eee7d7','靴子','#5b4e46'),outfit('羽绒服','#eee7d7','长裤','#5b4e46','靴子','#5b4e46')],['玫瑰拿铁 · 傍晚见面','灰粉与深咖呼应，细腰带让衬衫更利落。',outfit('衬衫','#d9afb0','长裤','#5b4e46','休闲鞋','#5b4e46','细腰带'),outfit('衬衫','#eee7d7','长裙','#d9afb0','高跟鞋','#5b4e46','细腰带')],['深海漫步 · 周末看展','藏青与雾蓝配米白，安静而有层次。',outfit('衬衫','#344c48','长裤','#eee7d7','休闲鞋','#33343b'),outfit('衬衫','#7f9aaf','短裙','#344c48','靴子','#33343b')],['落日橘糖 · 秋日散步','暖棕成为共同的色彩，绿色平衡暖意。',outfit('卫衣','#c47756','长裤','#344c48','运动鞋','#eee7d7'),outfit('卫衣','#eee7d7','长裙','#c47756','休闲鞋','#344c48')]];
let active=0,rec=0,state={people:[structuredClone(presets[0][2]),structuredClone(presets[0][3])],background:'街角',time:'午后'};try{let s=JSON.parse(localStorage.getItem('pair-outfits-v1'));if(s&&s.people?.length===2&&s.people.every(p=>Object.keys(options).every(k=>options[k].includes(p[k]))&&Object.keys(options).every(k=>/^#[0-9a-f]{6}$/i.test(p[k+'Color']))))state=s}catch{}
function persist(){try{localStorage.setItem('pair-outfits-v1',JSON.stringify(state))}catch{}}
function controls(){ $('controls').innerHTML=Object.keys(options).map(k=>`<div class="row"><label for="${k}">${labels[k]}</label><div class="fields"><select id="${k}">${options[k].map(v=>`<option ${state.people[active][k]===v?'selected':''}>${v}</option>`).join('')}</select><input id="${k}Color" type="color" value="${state.people[active][k+'Color']}" aria-label="${labels[k]}颜色"></div><div class="swatches">${colors.map(c=>`<button style="background:${c}" data-key="${k}" data-color="${c}" aria-label="${labels[k]}颜色 ${c}"></button>`).join('')}</div></div>`).join('');Object.keys(options).forEach(k=>{ $(k).onchange=e=>{state.people[active][k]=e.target.value;custom()};$(k+'Color').oninput=e=>{state.people[active][k+'Color']=e.target.value;custom()}});document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{state.people[active][b.dataset.key+'Color']=b.dataset.color;$(b.dataset.key+'Color').value=b.dataset.color;custom()});['A','B'].forEach((n,i)=>{$('tab'+n).classList.toggle('active',i===active);$('tab'+n).setAttribute('aria-pressed',i===active)})}
function custom(){$('recName').textContent='你的专属搭配';$('recDesc').textContent='一点点调整，穿出两个人的默契。';draw()}
function person(p,x,scale,longHair,label){let tc=p.topColor,bc=p.bottomColor,sc=p.shoeColor;let short=p.bottom==='短裤'||p.bottom==='短裙',skirt=p.bottom.includes('裙'),hem=short?307:382;return `<g transform="translate(${x} 20) scale(${scale})" stroke="#344c48" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><ellipse cx="0" cy="425" rx="67" ry="10" fill="#344c48" opacity=".09" stroke="none"/>${longHair?'<path d="M-29 66 Q-52 103 -32 162 L31 162 Q49 105 28 64Z" fill="#51443d"/>':''}<path d="M-22 287 L-22 408 M22 287 L22 408" stroke="#efd5bd" stroke-width="21"/><path d="M-44 161 L-55 263 M44 161 L55 263" stroke="${tc}" stroke-width="25"/><path d="M-55 263 v12 M55 263 v12" stroke="#efd5bd" stroke-width="14"/>${skirt?`<path d="M-36 245 L-56 ${hem} Q0 ${hem+12} 56 ${hem} L36 245Z" fill="${bc}"/><path d="M-18 259 L-25 ${hem-3} M14 259 L25 ${hem-3}" opacity=".18"/>`:`<path d="M-36 242 L36 242 L39 ${hem} L10 ${hem} L0 282 L-10 ${hem} L-39 ${hem}Z" fill="${bc}"/>`}<path d="M-19 133 L-40 146 L-37 250 Q0 258 37 250 L40 146 L19 133Z" fill="${tc}"/>${p.top==='短袖'?`<path d="M-39 147 L-56 164 L-49 191 L-35 188 M39 147 L56 164 L49 191 L35 188" fill="${tc}"/><path d="M-51 202 L-55 263 M51 202 L55 263" stroke="#efd5bd" stroke-width="20"/>`:''}${p.top==='卫衣'?'<path d="M-20 135 Q-34 156 0 165 Q34 156 20 135 M-15 157 v24 M15 157 v24" fill="none"/><path d="M-24 216 Q0 227 24 216 L20 239 L-20 239Z" fill="#ffffff" opacity=".17"/>':''}${p.top==='羽绒服'?'<path d="M-20 133 Q-40 143 -24 165 L0 150 L24 165 Q40 143 20 133" fill="none"/><path d="M0 151 v100 M-35 180 H35 M-36 205 H36 M-36 230 H36" opacity=".35"/>':''}${p.top==='衬衫'?'<path d="M-19 133 L0 150 L-15 168 L-26 144 M19 133 L0 150 L15 168 L26 144 M0 153 v99" fill="#ffffff" fill-opacity=".18"/><g fill="#344c48" stroke="none"><circle cy="177" r="2"/><circle cy="197" r="2"/><circle cy="217" r="2"/><circle cy="237" r="2"/></g>':''}${p.belt!=='无腰带'?`<path d="M-36 246 H36" stroke="${p.beltColor}" stroke-width="${p.belt==='宽腰带'?12:6}"/><rect x="-5" y="241" width="10" height="10" rx="1" fill="none" stroke="#c7ae77"/>`:''}${[-1,1].map(d=>`<g transform="translate(${d*23} 0)">${p.shoe==='靴子'?`<path d="M-12 363 H10 L12 405 L${d>0?24:16} 414 Q20 423 -14 420Z" fill="${sc}"/>`:p.shoe==='高跟鞋'?`<path d="M-12 401 L0 411 L10 402 L23 415 Q28 421 -11 420Z" fill="${sc}"/><path d="M-10 419 v9" stroke="${sc}" stroke-width="5"/>`:`<path d="M-12 402 Q0 410 9 402 L23 412 Q30 423 -14 420Z" fill="${sc}"/><path d="M-12 419 H22" stroke="#f8f6ef" stroke-width="4"/>${p.shoe==='运动鞋'?'<path d="M0 410 l6 2 m-1 -5 l6 2" stroke="#f8f6ef"/>':''}`}</g>`).join('')}<rect x="-10" y="116" width="20" height="25" rx="7" fill="#efd5bd"/><ellipse cy="91" rx="30" ry="36" fill="#efd5bd"/><path d="M-29 91 Q-42 45 3 49 Q38 49 30 91 L20 70 Q-3 83 -25 75Z" fill="#51443d"/><path d="M-14 92 h1 M13 92 h1" stroke-width="3"/><path d="M-5 107 Q0 111 5 107" fill="none"/><path d="M-22 103 h6 M17 103 h6" stroke="#dca99b" stroke-width="4" opacity=".7"/><text x="0" y="465" text-anchor="middle" fill="#688078" stroke="none" font-size="15" font-family="system-ui">${label}</text></g>`}
function draw(){let night=state.time==='夜晚',sky=night?'#465e64':state.time==='傍晚'?'#ead2bf':state.time==='清晨'?'#e5ebe0':'#e6ede5';let bg=`<rect width="800" height="540" fill="${sky}"/><circle cx="660" cy="95" r="36" fill="${night?'#f4edce':'#f6edd5'}"/><path d="M0 401 Q400 365 800 405 V540 H0Z" fill="${night?'#526966':'#d5dfd1'}"/><path d="M0 465 H800" stroke="#bac8b8" fill="none"/>`;if(state.background==='公园')bg+=[70,160,658,737].map((x,i)=>`<path d="M${x} 200 V410" stroke="#9aa68e" stroke-width="9"/><ellipse cx="${x}" cy="${220+i*10}" rx="62" ry="96" fill="${night?'#3c5650':'#bdcdb7'}"/>`).join('');else bg+=`<g fill="${night?'#3b5358':'#d0dbce'}"><path d="M0 174 H180 V400 H0Z M625 220 H800 V400 H625Z"/>${state.background==='校园'?'<path d="M57 177 L100 125 L145 177Z M650 221 L710 170 L775 221Z"/>':''}</g><g fill="${night?'#e7d8ab':'#e6ede0'}">${[25,90,660,725].map(x=>[240,305].map(y=>`<rect x="${x}" y="${y}" width="33" height="42" rx="3"/>`).join('')).join('')}</g><path d="M0 400 H800" stroke="#b4c2b0"/>`; $('art').innerHTML=bg+person(state.people[0],300,1,false,'小 A')+person(state.people[1],505,.94,true,'小 B')+`<path d="M397 207 q-9 -10 -13 0 q0 7 13 15 q13 -8 13 -15 q-4 -10 -13 0" fill="#c47756" opacity=".6"/>`;['A','B'].forEach((n,i)=>{let p=state.people[i];$('look'+n).innerHTML=`<b>小 ${n}</b> · ${p.top} / ${p.bottom}<br>${p.belt==='无腰带'?'轻松出门':p.belt} · ${p.shoe}`});$('sceneLabel').textContent=state.background+' · '+state.time;$('background').value=state.background;$('time').value=state.time;persist()}
function apply(i){rec=i;state.people=[structuredClone(presets[i][2]),structuredClone(presets[i][3])];$('recName').textContent=presets[i][0];$('recDesc').textContent=presets[i][1];$('caption').textContent=presets[i][1];controls();draw()}
$('tabA').onclick=()=>{active=0;controls()};$('tabB').onclick=()=>{active=1;controls()};$('recommend').onclick=()=>apply((rec+1)%presets.length);$('swap').onclick=()=>{state.people.reverse();controls();custom()};$('reset').onclick=()=>{state.background='街角';state.time='午后';active=0;apply(0)};['background','time'].forEach(k=>$(k).onchange=e=>{state[k]=e.target.value;draw()});$('save').onclick=()=>{let svg=$('art').cloneNode(true);svg.setAttribute('xmlns','http://www.w3.org/2000/svg');let url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'}));let image=new Image();image.onload=()=>{let c=document.createElement('canvas');c.width=1600;c.height=1080;let ctx=c.getContext('2d');ctx.drawImage(image,0,0,1600,1080);URL.revokeObjectURL(url);c.toBlob(b=>{if(!b)return;let a=document.createElement('a'),u=URL.createObjectURL(b);a.href=u;a.download='今天穿一对.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)})};image.src=url};controls();draw();
